<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/fonts.css">
  <title>Manifik LinkedIn cover</title>
  <style>
    *{box-sizing:border-box}html,body{width:1584px;height:396px;margin:0;overflow:hidden}body{background:#e7f4f9;color:#152c42;font-family:Manrope,Arial,sans-serif}.cover{position:relative;width:1584px;height:396px;overflow:hidden;background:radial-gradient(circle at 87% 16%,#ffffff92 0 4%,transparent 21%),#e7f4f9}.wordmark{position:absolute;left:388px;top:-41px;font:500 168px/.9 'Space Grotesk',Arial,sans-serif;letter-spacing:-.09em;color:#152c42;white-space:nowrap}.eyebrow{position:absolute;left:408px;top:177px;font:400 12px/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#527086}.statement{position:absolute;left:408px;top:205px;font:500 45px/1.02 'Space Grotesk',Arial,sans-serif;letter-spacing:-.055em}.footer{position:absolute;left:408px;bottom:31px;font:400 12px/1.3 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#527086}.line{position:absolute;left:408px;right:54px;bottom:62px;height:1px;background:#a9c4d0}.profile-safe{position:absolute;left:0;bottom:0;width:350px;height:136px;background:linear-gradient(90deg,#e7f4f9 75%,transparent);pointer-events:none}.chip{position:absolute;display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border:1px solid #9db6c2;border-radius:999px;font:500 15px/1 'Space Grotesk',Arial,sans-serif;background:#e7f4f9;color:#152c42;white-space:nowrap}.chip-1{right:294px;top:144px;transform:rotate(-5deg)}.chip-2{right:107px;top:104px;transform:rotate(4deg)}.chip-3{right:187px;top:211px;transform:rotate(3deg)}.chip-4{right:53px;top:263px;transform:rotate(-4deg)}.accent{position:absolute;right:-66px;top:-124px;width:374px;height:374px;border:1px solid #8cadba;border-radius:50%;transform:rotate(-21deg) scaleY(.55);opacity:.7}.orbit{position:absolute;right:170px;top:59px;width:96px;height:96px;border-radius:50%;border:1px solid #d0e0e6}.corner{position:absolute;left:50px;top:34px;font:700 28px/1 'Space Grotesk',Arial,sans-serif;letter-spacing:-.07em}.corner sup{font:400 12px/1 Manrope,Arial,sans-serif;vertical-align:top;margin-left:2px}
  </style>
</head>
<body>
  <main class="cover" aria-label="Manifik LinkedIn cover">
    <span class="corner">Manifik<sup>®</sup></span><span class="wordmark" aria-hidden="true">Manifik</span>
    <span class="accent" aria-hidden="true"></span><span class="orbit" aria-hidden="true"></span>
    <span class="eyebrow">Branding studio</span><strong class="statement">We give meaning<br>character.</strong>
    <span class="chip chip-1">Identity</span><span class="chip chip-2">Naming</span><span class="chip chip-3">Packaging</span><span class="chip chip-4">Digital</span>
    <span class="line" aria-hidden="true"></span><span class="footer">STRATEGY&nbsp;&nbsp;/&nbsp;&nbsp;IDENTITY&nbsp;&nbsp;/&nbsp;&nbsp;DIGITAL EXPERIENCE</span><span class="profile-safe" aria-hidden="true"></span>
  </main>
</body>
</html>
