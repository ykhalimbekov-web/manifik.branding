<!doctype html><meta charset="utf-8"><style>body{font:12px system-ui;margin:16px;color:#152c42;background:#f7f8f4}button{padding:10px 12px;margin:0 6px 8px 0;border:0;border-radius:6px;background:#152c42;color:white;cursor:pointer}pre{white-space:pre-wrap;max-height:330px;overflow:auto;font:11px monospace}img{width:100%;height:auto}h3{margin:0 0 12px}</style><h3>Manifik · Mobile & prototype</h3><div id="buttons"></div><pre id="log">Ready</pre><img id="preview"><script>const actions=[['caseHero','Case cover'],['caseStory','Case story'],['caseSystem','Case system'],['caseFinish','Case finish'],['caseQA','Case QA'],['inspect','Inspect'],['hero','Mobile hero'],['work','Mobile work'],['studio','Mobile studio'],['contact','Mobile contact'],['prototype','Prototype'],['qa','QA'],['preview','Preview selected'],['close','Close']];for(const [action,label] of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>parent.postMessage({pluginMessage:{action}},'*');document.getElementById('buttons').appendChild(b)}onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='log')document.getElementById('log').textContent=m.text;if(m.type==='image'){document.getElementById('preview').src=URL.createObjectURL(new Blob([m.bytes],{type:'image/png'}));}};</script>
